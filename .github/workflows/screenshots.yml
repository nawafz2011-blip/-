name: صور شاشات التطبيق

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: رسم الشاشات
        id: record
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :app:recordPaparazziDebug

      - name: ملخص الأخطاء
        if: steps.record.outcome == 'failure'
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                  text = (fl.text or "").splitlines()
                  keep = [l for l in text if "com.nawaf" in l or not l.strip().startswith("at ")][:14]
                  print("FAILED", tc.get("classname"), tc.get("name"), "::", fl.get("message", "")[:400])
                  print("\n".join(keep))
          PY
          done

      - name: نشر الصور
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots
          name: صور شاشات التطبيق (معاينة)
          body: صور تلقائية لشاشات تطبيق الأندرويد. تتحدث مع كل تعديل.
          prerelease: true
          make_latest: "false"
          target_commitish: ${{ github.sha }}
          files: android/app/src/test/snapshots/images/*.png
          fail_on_unmatched_files: false

      - name: فشل إذا فيه خطأ
        if: steps.record.outcome == 'failure'
        run: exit 1
